name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          # If your org/repo forbids GITHUB_TOKEN from creating PRs, create a PAT
          # (repo scope) on a bot user, save it as secret RELEASE_PLEASE_TOKEN,
          # and uncomment the next line:
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
